# Builds the Windows desktop app and attaches it to a GitHub release.
# The website's "Windows uygulamasını indir" button always points to
#   releases/latest/download/MediaDownloaderHub-Windows.exe
#
# New version:  git tag v2.0.1 && git push origin v2.0.1
name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Deno (yt-dlp needs it for YouTube)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath tools
          .\tools\deno.exe --version

      - name: Smoke test (imports, link parser, ffmpeg)
        run: |
          python -c "import desktop_link, downloader.engine, subtitle.engine, ui.app; print(desktop_link.parse_link('mdhub://download?url=https%3A%2F%2Fexample.com%2Fv&format=mp3'))"
          python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Build .exe
        run: >
          pyinstaller --noconfirm --clean --noconsole --onefile
          --name MediaDownloaderHub-Windows
          --collect-all customtkinter
          --collect-all imageio_ffmpeg
          --collect-all yt_dlp_ejs
          --collect-data faster_whisper
          --add-binary "tools/deno.exe;."
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: MediaDownloaderHub-Windows
          path: dist/MediaDownloaderHub-Windows.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MediaDownloaderHub-Windows.exe
          generate_release_notes: true
