# Builds the Windows app (.exe) and the Android app (.apk) and publishes them
# as a GitHub release. The website's download buttons always point to
#   releases/latest/download/MedyaIndir-Windows.exe
#   releases/latest/download/MedyaIndir-Android.apk
#
# Runs on every push to main that touches app code, or manually (Actions > Release > Run workflow).
name: Release

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "desktop_link.py"
      - "downloader/**"
      - "subtitle/**"
      - "ui/**"
      - "requirements.txt"
      - "mobile/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Deno (yt-dlp needs it for YouTube)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath tools
          .\tools\deno.exe --version

      - name: Smoke test (imports, link parser, ffmpeg)
        run: |
          python -c "import desktop_link, downloader.engine, subtitle.engine, ui.app; print(desktop_link.parse_link('mdhub://download?url=https%3A%2F%2Fexample.com%2Fv&format=mp3'))"
          python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Build .exe
        run: >
          pyinstaller --noconfirm --clean --noconsole --onefile
          --name MedyaIndir-Windows
          --collect-all customtkinter
          --collect-all imageio_ffmpeg
          --collect-all yt_dlp_ejs
          --collect-data faster_whisper
          --add-binary "tools/deno.exe;."
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MedyaIndir-Windows.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Release signing key (optional secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; APK is signed with a temporary debug key (users can't update over it later)."
          fi

      - name: Build APKs
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release --split-per-abi
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../out/MedyaIndir-Android.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../out/MedyaIndir-Android-armv7.apk
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Medya İndir v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            **Windows:** `MedyaIndir-Windows.exe` — çift tıklayıp aç, kurulum yok.
            **Android:** `MedyaIndir-Android.apk` (çoğu telefon). Eski 32-bit telefonlar için `-armv7.apk`.

            Siteden "İndir"e basınca uygulama açılır ve indirme senin cihazında yapılır.
          files: dist/*
